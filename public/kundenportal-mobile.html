<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Helbling Kundenportal - Mobile Vorschau</title>
  <style>
    :root{--he:#1C1B78;--bg:#e8e9f0;--ink:#171717}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);font:14px Arial,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:18px}
    .hint{width:min(390px,100%);margin-bottom:10px;color:var(--he);font-weight:bold;text-align:center}
    .phone{width:390px;max-width:100%;height:min(844px,calc(100vh - 72px));background:#fff;border:8px solid #202027;border-radius:28px;overflow:hidden;box-shadow:0 16px 45px #0003}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    @media(max-width:430px){body{padding:0}.hint{display:none}.phone{width:100%;height:100vh;border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <div class="hint">Mobile Vorschau · 390 × 844 Pixel</div>
  <div class="phone"><iframe src="/kundenportal-demo.html" title="Mobile Kundenportal-Demo"></iframe></div>
</body>
</html>
