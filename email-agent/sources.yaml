# Konfiguration der Wissensquellen für Helbling & Co. AG
# Dieses File definiert welche URLs und lokalen Pfade in die Wissensdatenbank geladen werden

local_sources:
  - path: "./knowledge_base/preislisten"
    category: "allgemein"
    description: "Preislisten für alle Produkte"
  - path: "./knowledge_base/produkte"
    category: "allgemein"
    description: "Produktbeschreibungen und technische Daten"
  - path: "./knowledge_base/faq"
    category: "allgemein"
    description: "Häufige Fragen und Standardantworten"
  - path: "./knowledge_base/vorlagen"
    category: "allgemein"
    description: "E-Mail-Vorlagen und Textbausteine"
  - path: "./knowledge_base/firmeninfo"
    category: "allgemein"
    description: "Allgemeine Firmendaten und Kontakte"
  - path: "./knowledge_base/dokumente"
    category: "allgemein"
    description: "PDFs, Datenblätter, Zertifikate"

web_sources:
  - name: "Helbling Homepage"
    url: "https://www.helbling.ch"
    crawl_depth: 2
    include_patterns:
      - "/produkte/"
      - "/dienstleistungen/"
      - "/ueber-uns/"
    exclude_patterns:
      - "/blog/"
      - "/impressum/"
    category: "allgemein"
    refresh_interval_hours: 168
